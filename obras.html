<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Under Construction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="imgs/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Ibarra+Real+Nova:wght@400;600&display=swap" rel="stylesheet">
</head>

<body style="
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 34px;
  font-family: 'Ibarra Real Nova', serif;
  color: #FFFFFF;

  background:
    linear-gradient(#0000009E, #0000009E),
    url('imgs/store.png') center / cover no-repeat;
">

  <!-- Só para as outras páginas não levarem para o erro e as manter clicáveis -->

  <div style="
    width: 100%;
    max-width: 860px;
    text-align: center;
    padding: 44px 34px;

    background: #FFFFFF14;
    border: 1px solid #FFFFFF4D;

    border-radius: 0;

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 18px 60px #00000059;
  ">

    <div style="
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid #FFFFFF59;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.95;
    ">
      Under Construction
    </div>

    <h1 style="
      margin: 18px 0 0;
      font-family: 'DM Serif Display', serif;
      font-size: 46px;
      font-weight: 400;
      letter-spacing: 1px;
      line-height: 1.15;
    ">
      This page is being refined
    </h1>

    <p style="
      margin: 16px auto 0;
      max-width: 620px;
      font-size: 17px;
      line-height: 1.7;
      opacity: 0.95;
    ">
      We are carefully crafting this section to deliver an experience that matches our standards — it will be available soon.
    </p>

    <a href="index.html"
      style="
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 12px 30px;

        font-family: 'Ibarra Real Nova', serif;
        font-size: 16px;

        border: 1px solid #ffffff;
        background: transparent;
        color: #ffffff;
        text-decoration: none;

        cursor: pointer;
        transition: 0.2s;
      "
      onmouseover="this.style.background='#385269'; this.style.borderColor='#385269'; this.style.color='#FFFFFF';"
      onmouseout="this.style.background='transparent'; this.style.borderColor='#ffffff'; this.style.color='#ffffff';"
    >
      Return to Home
    </a>

  </div>

</body>
</html>
